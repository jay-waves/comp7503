name: comp7503

services:
  node-red:
    build:
      context: ./node-red
    image: comp7503-node-red:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      TZ: Asia/Shanghai
      FLOWS: flows.json
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?Run bash start.sh first}:${MONGO_ROOT_PASSWORD:?Run bash start.sh first}@mongodb:27017/comp7503?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./node-red/data:/data:Z
      - ./scripts:/opt/comp7503/scripts:ro,Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run bash start.sh first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run bash start.sh first}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - "127.0.0.1"
        - --eval
        - "const admin = db.getSiblingDB('admin'); admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD); quit(admin.runCommand({ping: 1}).ok === 1 ? 0 : 1);"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
  mongodb_config:
